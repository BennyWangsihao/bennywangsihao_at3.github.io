<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrollscape</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 
    备注：Scrollscape 是一个以“滚动”为唯一交互的数字景观。六个场景的背景现在使用
    Unsplash 上的实景摄影图片，分别对应深海、浅海、沙滩、草原、高山和星空。
    每一张图片都经过半透明黑色叠加，以确保白色文字始终可读。
    页面结构保持极简，让滚动成为探索旅程的核心驱动力。
  -->
  <div class="stage" id="stage"></div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
